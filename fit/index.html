<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Company Fit — Dedipya Goswami</title>
  <meta name="description" content="Reusable company-fit application page for Dedipya Goswami." />
  <style>
    :root{--bg:#07090d;--panel:#0f141d;--line:#252d3d;--text:#f4f7fb;--muted:#9ca7b8;--cyan:#72e7ff;--violet:#a697ff;--green:#7bf0b1;--max:1140px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% 0%,rgba(118,90,255,.18),transparent 28%),radial-gradient(circle at 10% 5%,rgba(56,214,255,.08),transparent 24%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}a{color:inherit;text-decoration:none}.wrap{max-width:var(--max);margin:auto;padding:0 22px}.nav{height:68px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;position:sticky;top:0;background:rgba(7,9,13,.84);backdrop-filter:blur(16px);z-index:10}.nav .wrap{width:100%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.brand span{color:var(--cyan)}.navlinks{display:flex;gap:18px;color:var(--muted);font-size:13px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:42px;align-items:center;padding:80px 0 48px}.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:#c6cfdd;font-size:12px}.dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 14px var(--green)}h1{font-size:clamp(44px,7vw,76px);line-height:.98;letter-spacing:-.055em;margin:22px 0 18px}.grad{background:linear-gradient(90deg,var(--cyan),#d8d2ff,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}.lead{color:#b6c0cf;font-size:19px;max-width:760px}.actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:28px}.btn{padding:11px 15px;border:1px solid #2b3447;border-radius:10px;background:#111722;font-weight:700;font-size:13px}.btn.primary{background:white;color:#080b10;border-color:white}.meta-card,.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(16,21,31,.95),rgba(10,13,20,.94));padding:21px}.meta-card small{color:var(--cyan);font-weight:800;letter-spacing:.1em}.meta-row{padding:12px 0;border-top:1px solid rgba(255,255,255,.06)}.meta-row:first-of-type{margin-top:12px}.meta-row b{display:block;font-size:13px}.meta-row span{color:var(--muted);font-size:12px}section{padding:52px 0}.section-head{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:22px}.kicker{color:var(--cyan);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.13em}.section-head h2{font-size:33px;letter-spacing:-.035em;margin:5px 0 0}.section-head p{margin:0;color:var(--muted);max-width:600px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.span6{grid-column:span 6}.span4{grid-column:span 4}.span8{grid-column:span 8}.label{font-size:11px;color:var(--green);font-weight:900;letter-spacing:.05em}.card h3{font-size:20px;margin:8px 0}.card p{color:#b2bccb;margin:0 0 14px}.tag{display:inline-block;padding:5px 8px;border:1px solid #2b3448;border-radius:7px;color:#b9c3d2;font-size:11px;margin:3px 4px 3px 0}.list{list-style:none;padding:0;margin:12px 0 0}.list li{padding:7px 0;border-top:1px solid rgba(255,255,255,.06);color:#bcc5d2;font-size:13px}.list li:before{content:"↳";color:var(--cyan);margin-right:8px}.fit-table{display:grid;gap:10px}.fit-row{display:grid;grid-template-columns:.8fr 1.4fr;gap:18px;border:1px solid var(--line);border-radius:14px;background:#0d121a;padding:16px}.fit-row b{color:#eef3fb}.fit-row span{color:#aeb8c7}.workflow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.wf{border:1px solid var(--line);border-radius:13px;background:#0d121a;padding:15px}.wf small{color:var(--cyan);font-weight:800}.wf b{display:block;margin:12px 0 5px}.wf p{margin:0;color:var(--muted);font-size:12px}.proof-links{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.proof{border:1px solid var(--line);border-radius:14px;padding:17px;background:#0d121a}.proof b{display:block;margin-bottom:6px}.proof p{margin:0;color:var(--muted);font-size:12px}.proof .go{display:inline-block;margin-top:12px;color:var(--cyan);font-size:12px;font-weight:800}.note{margin-top:14px;border-left:2px solid var(--violet);background:#0d1119;padding:16px;border-radius:0 12px 12px 0;color:#c7d0dd}.cta{margin:44px 0 72px;border:1px solid #313b52;border-radius:22px;background:linear-gradient(120deg,rgba(24,31,44,.95),rgba(15,16,28,.95));padding:30px;display:flex;justify-content:space-between;gap:26px;align-items:center}.cta h2{margin:0 0 7px;font-size:28px}.cta p{margin:0;color:#aeb8c7;max-width:720px}.footer{border-top:1px solid rgba(255,255,255,.06);padding:22px 0 34px;color:#778397;font-size:12px;display:flex;justify-content:space-between;gap:20px}.error{padding:70px 0;color:#f5b7b7}@media(max-width:900px){.hero{grid-template-columns:1fr}.span6,.span4,.span8{grid-column:span 12}.workflow,.proof-links{grid-template-columns:1fr 1fr}.fit-row{grid-template-columns:1fr}.cta{align-items:flex-start;flex-direction:column}.navlinks{display:none}}@media(max-width:560px){.workflow,.proof-links{grid-template-columns:1fr}h1{font-size:46px}.section-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <nav class="nav"><div class="wrap"><a class="brand" href="#top">Dedipya<span>.fit</span></a><div class="navlinks"><a href="#fit">Why fit</a><a href="#work">Work</a><a href="#agents">AI workflow</a><a href="#proof">Proof</a></div></div></nav>
  <main class="wrap" id="app"><div class="error">Loading company configuration…</div></main>
  <script>
    const profile={
      name:'Dedipya Goswami',
      title:'Backend + Agentic AI Engineer',
      email:'dedipyagoswami001@gmail.com',
      github:'https://github.com/dedipya001',
      linkedin:'https://www.linkedin.com/in/dedipya-goswami001/',
      portfolio:'https://dedipya001.github.io/',
      encye:'https://app.encye.com',
      rag:'https://broker-server.selegic.com/',
      stack:['Python','TypeScript','Node.js','Express.js','FastAPI','MongoDB','PostgreSQL','Redis','REST APIs','AWS','CI/CD','Terraform','MCP','RAG','LLMs','Agentic AI','Salesforce APIs','Prometheus / Grafana']
    };
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function boot(){
      try{
        const r=await fetch('./company.json',{cache:'no-store'}); if(!r.ok) throw new Error('Could not load company.json');
        const c=await r.json();
        document.title=`${c.companyName} Fit — ${profile.name}`;
        document.querySelector('meta[name="description"]').content=`Why ${profile.name} is a strong fit for ${c.roleTitle} at ${c.companyName}.`;
        document.getElementById('app').innerHTML=`
          <div id="top" class="hero">
            <div>
              <div class="eyebrow"><span class="dot"></span> Tailored application · ${esc(c.companyName)} · ${esc(c.roleTitle)}</div>
              <h1>Why I fit <span class="grad">${esc(c.companyName)}</span></h1>
              <p class="lead">${esc(c.intro)}</p>
              <div class="actions"><a class="btn primary" href="#fit">See the match</a><a class="btn" href="${esc(c.jobUrl)}" target="_blank">Job ↗</a><a class="btn" href="${profile.portfolio}" target="_blank">Portfolio ↗</a></div>
            </div>
            <aside class="meta-card"><small>ROLE SNAPSHOT</small><div class="meta-row"><b>Company</b><span>${esc(c.companyName)}</span></div><div class="meta-row"><b>Role</b><span>${esc(c.roleTitle)}</span></div><div class="meta-row"><b>What this page targets</b><span>${esc(c.applicationTheme)}</span></div><div class="meta-row"><b>My profile</b><span>${profile.title}</span></div></aside>
          </div>

          <section id="fit"><div class="section-head"><div><div class="kicker">Role match</div><h2>The requirement → my evidence</h2></div><p>This is the only company-specific part. Change <code>fit/company.json</code> and the page adapts.</p></div><div class="fit-table">${(c.fitMappings||[]).map(x=>`<div class="fit-row"><b>${esc(x.need)}</b><span>${esc(x.proof)}</span></div>`).join('')}</div></section>

          <section id="work"><div class="section-head"><div><div class="kicker">Reusable proof</div><h2>What I have already built</h2></div><p>This section stays the same across applications because it is my actual work, not company-specific marketing.</p></div><div class="grid">
            <article class="card span6"><div class="label">ENCYE · PRODUCTION BACKEND</div><h3>Multi-tenant SaaS backend systems</h3><p>Version-control workflows, department backend design, comments, tagging, notifications, login/auth and other platform services.</p><div><span class="tag">Node.js</span><span class="tag">TypeScript</span><span class="tag">MongoDB</span><span class="tag">Redis</span><span class="tag">REST APIs</span><span class="tag">AWS</span></div><a class="btn" style="display:inline-block;margin-top:13px" href="${profile.encye}" target="_blank">Open Encye ↗</a></article>
            <article class="card span6"><div class="label">RAG SYSTEM · FULL OWNERSHIP</div><h3>Enterprise ingestion + retrieval for Encye</h3><p>Owned end-to-end: ingestion, processing, retrieval and the backend surface used by AI workflows.</p><div><span class="tag">Python</span><span class="tag">RAG</span><span class="tag">LLMs</span><span class="tag">Embeddings</span><span class="tag">Data pipelines</span></div><a class="btn" style="display:inline-block;margin-top:13px" href="${profile.rag}" target="_blank">Open RAG system ↗</a></article>
            <article class="card span8"><div class="label">SELEGIC CPQ · AI ASSISTANT</div><h3>RAG + LLM assistant for Salesforce CPQ</h3><p>Transforms Salesforce CPQ knowledge and metadata into contextual answers and configuration guidance. Demo video can be added per application when useful.</p><div><span class="tag">Salesforce APIs</span><span class="tag">RAG</span><span class="tag">LLM</span><span class="tag">Python</span><span class="tag">MCP</span></div></article>
            <article class="card span4"><div class="label">BELZABAR · AUTOMATION TEAM</div><h3>Connected-service integrations</h3><p>Worked with provider APIs and automation flows across Google, Zapier, Salesforce, Slack and related services, alongside DevOps automation work.</p><div><span class="tag">Google APIs</span><span class="tag">Zapier</span><span class="tag">Salesforce</span><span class="tag">Slack</span><span class="tag">Python</span><span class="tag">Automation</span></div></article>
          </div></section>

          <section id="agents"><div class="section-head"><div><div class="kicker">How I build</div><h2>Agent-first engineering workflow</h2></div><p>I use Codex and Claude through OpenRouter to increase implementation speed while I retain architecture, verification and production responsibility.</p></div><div class="workflow">
            <div class="wf"><small>01 · FRAME</small><b>Scope outcome</b><p>Clarify users, constraints and the smallest useful result.</p></div>
            <div class="wf"><small>02 · DESIGN</small><b>Choose interfaces</b><p>APIs, data models, tool boundaries, state and failure behavior.</p></div>
            <div class="wf"><small>03 · DELEGATE</small><b>Direct agents</b><p>Use Codex/Claude for implementation, exploration, migrations and refactors.</p></div>
            <div class="wf"><small>04 · VERIFY</small><b>Catch mistakes</b><p>Review diffs, test integrations, inspect logs and challenge assumptions.</p></div>
            <div class="wf"><small>05 · SHIP</small><b>Own behavior</b><p>Deploy, observe, iterate and refactor as requirements or models change.</p></div>
          </div><div class="note"><strong>Proof of the workflow:</strong> this company-fit page itself is designed to be reusable. The first tailored version was scoped, generated, reviewed and deployed with AI assistance in about 20 minutes.</div></section>

          <section id="proof"><div class="section-head"><div><div class="kicker">Live proof</div><h2>Public integrations already in my portfolio</h2></div><p>These are real integrations already present in the main portfolio rather than mock cards created only for an application.</p></div><div class="proof-links">
            <a class="proof" href="${profile.portfolio}#activity" target="_blank"><b>GitHub integration</b><p>Live GitHub activity and repository data integrated into my personal portfolio.</p><span class="go">View live proof ↗</span></a>
            <a class="proof" href="${profile.portfolio}#blogs" target="_blank"><b>Medium integration</b><p>Medium publication data surfaced directly inside the portfolio.</p><span class="go">View live proof ↗</span></a>
            <a class="proof" href="${profile.github}" target="_blank"><b>GitHub projects</b><p>Public code and shipped personal projects.</p><span class="go">Open GitHub ↗</span></a>
          </div></section>

          <section><div class="section-head"><div><div class="kicker">Stack</div><h2>Backend first, AI-native</h2></div></div><div>${profile.stack.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></section>

          <section><div class="cta"><div><h2>${esc(c.companyName)} + ${esc(profile.name)}</h2><p>${esc(c.closing)}</p></div><div class="actions" style="margin:0"><a class="btn primary" href="mailto:${profile.email}">Email me</a><a class="btn" href="${profile.linkedin}" target="_blank">LinkedIn ↗</a></div></div></section>
          <footer class="footer"><span>${profile.name} · ${profile.title}</span><span>Reusable application template · company data lives in company.json</span></footer>
        `;
      }catch(e){document.getElementById('app').innerHTML=`<div class="error"><h2>Could not load company configuration.</h2><p>${esc(e.message)}</p></div>`}
    }
    boot();
  </script>
</body>
</html>
